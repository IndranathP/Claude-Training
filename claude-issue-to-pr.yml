name: Claude Issue → PR

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

# One run per issue at a time. A newer event replaces a queued one.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  process:
    # Guards:
    # - Only trusted authors (owner/member/collaborator), because issues trigger code changes and API spend.
    # - opened/reopened: always check.  edited: only re-check while the issue is waiting on info.
    # - comment: only on issues (not PRs) labeled needs-info, written by the issue author or a
    #   trusted collaborator (never a bot). Triage then re-reads the issue description + ALL comments.
    # - Never re-run while Claude is already working on the issue.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'claude-working') &&
      (
        (github.event_name == 'issues' && (github.event.action != 'edited' ||
          contains(github.event.issue.labels.*.name, 'needs-info'))) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
          contains(github.event.issue.labels.*.name, 'needs-info') &&
          (github.event.comment.user.login == github.event.issue.user.login ||
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) &&
          github.event.comment.user.type != 'Bot')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write        # push the branch
      pull-requests: write   # open the PR
      issues: write          # comments + labels

    env:
      REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      # User-written text is passed through env vars, never interpolated into scripts (prevents injection)
      ISSUE_TITLE: ${{ github.event.issue.title }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLAUDE_MODEL: claude-sonnet-5-5
      TASK_PROMPT_FILE: /tmp/task_prompt.md
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tools Claude Code may use while implementing. Add your test command, e.g. Bash(npm test:*), Bash(pytest:*)
      IMPLEMENT_TOOLS: "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git status:*),Bash(ls:*)"
      ANSWER_TOOLS: "Read,Glob,Grep"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false   # Claude never gets a git token, so it can't push

      # ---------- Step 1: build a prompt from the issue and check it's sufficient ----------
      - name: Triage issue
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/issue_triage.py

      # needs_info → the triage script already commented and labeled; all later steps are skipped.

      - name: Install Claude Code
        if: steps.triage.outputs.decision == 'implement' || steps.triage.outputs.decision == 'answer'
        run: npm install -g @anthropic-ai/claude-code

      # ---------- Step 2a: implement ----------
      - name: Claude implements the issue
        if: steps.triage.outputs.decision == 'implement'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ""   # no GitHub token for this step
        run: |
          claude -p "$(cat "$TASK_PROMPT_FILE")" \
            --model "$CLAUDE_MODEL" \
            --max-turns 50 \
            --permission-mode acceptEdits \
            --allowedTools "$IMPLEMENT_TOOLS" \
            > /tmp/claude_output.md
          echo "----- Claude output -----"; cat /tmp/claude_output.md

      # ---------- Step 3: new branch + PR with a description of the changes ----------
      - name: Open pull request
        id: pr
        if: steps.triage.outputs.decision == 'implement'
        env:
          SLUG: ${{ steps.triage.outputs.issue_title_slug }}
        run: |
          set -euo pipefail
          # Workflow changes can't be pushed with GITHUB_TOKEN and shouldn't be AI-made: discard them
          git checkout -- .github/workflows 2>/dev/null || true
          git clean -fdq -- .github/workflows 2>/dev/null || true

          if [ -z "$(git status --porcelain)" ]; then
            {
              echo "🤖 Claude finished but made **no code changes**. Its notes:"
              echo; echo '<details><summary>Claude output</summary>'; echo
              head -c 60000 /tmp/claude_output.md
              echo; echo '</details>'; echo; echo "<sub>[Workflow run]($RUN_URL)</sub>"
            } > /tmp/comment.md
            gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md
            exit 0
          fi

          BRANCH="claude/issue-${ISSUE_NUMBER}-${SLUG}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -q -m "Resolve #${ISSUE_NUMBER}: ${ISSUE_TITLE}" -m "Implemented by Claude from issue #${ISSUE_NUMBER}."
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"

          {
            echo "Closes #${ISSUE_NUMBER}"; echo
            head -c 55000 /tmp/claude_output.md; echo
            echo "## Files changed"; echo '```'; git diff --stat HEAD~1 HEAD | tail -n 50; echo '```'
            echo "---"
            echo "🤖 Generated by Claude from issue #${ISSUE_NUMBER}. **Review carefully before merging.**"
            echo "<sub>[Workflow run]($RUN_URL)</sub>"
          } > /tmp/pr_body.md

          if gh pr view "$BRANCH" --repo "$REPO" >/dev/null 2>&1; then
            PR_URL=$(gh pr view "$BRANCH" --repo "$REPO" --json url -q .url)
            gh pr edit "$BRANCH" --repo "$REPO" --body-file /tmp/pr_body.md
          else
            PR_URL=$(gh pr create --repo "$REPO" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "Resolve #${ISSUE_NUMBER}: ${ISSUE_TITLE}" --body-file /tmp/pr_body.md)
          fi
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "🤖 Pull request opened: ${PR_URL}. Claude is reviewing it now."

      # ---------- Step 4: Claude code review, posted as PR comments ----------
      # Runs here because PRs opened with GITHUB_TOKEN don't trigger other workflows.
      - name: Claude reviews the PR
        if: steps.pr.outputs.pr_number != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: python3 .github/scripts/claude_review.py

      # ---------- Step 2b: answer / resolve without code ----------
      - name: Claude answers the issue
        if: steps.triage.outputs.decision == 'answer'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ""
        run: |
          claude -p "$(cat "$TASK_PROMPT_FILE")" \
            --model "$CLAUDE_MODEL" \
            --max-turns 30 \
            --allowedTools "$ANSWER_TOOLS" \
            > /tmp/claude_output.md

      - name: Post answer
        if: steps.triage.outputs.decision == 'answer'
        run: |
          { echo "🤖 **Claude's answer**"; echo; head -c 60000 /tmp/claude_output.md; echo
            echo; echo "<sub>If this resolves your question, feel free to close the issue. [Workflow run]($RUN_URL)</sub>"
          } > /tmp/comment.md
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file /tmp/comment.md

      # ---------- Always: clean up the working label; report failures ----------
      - name: Remove working label
        if: always() && (steps.triage.outputs.decision == 'implement' || steps.triage.outputs.decision == 'answer')
        run: gh issue edit "$ISSUE_NUMBER" --repo "$REPO" --remove-label claude-working || true

      - name: Report failure
        if: failure()
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" \
            --body "⚠️ Claude's automation hit an error on this issue. A maintainer can check the [workflow run]($RUN_URL)." || true
